<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#000000" />
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#718096" />
    </marker>
    <!-- Accent Arrow Marker for EDT -->
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5" />
    </marker>
  </defs>

  <style>
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #2D3748; text-anchor: middle; }
    .node-subtext { font-size: 11px; font-weight: normal; fill: #718096; }
    .edge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4A5568; font-weight: bold; text-anchor: middle; }
    .thread-node { fill: #EBF8FF; stroke: #BEE3F8; stroke-width: 2; }
    .queue-node { fill: #FEF3C7; stroke: #FDE68A; stroke-width: 2; }
    .edt-node { fill: #EEF2FF; stroke: #C7D2FE; stroke-width: 2; }
    .ui-node { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 2; }
  </style>

  <!-- Connectors (Edges) -->
  <!-- T1 to Q -->
  <path d="M 170 85 C 210 85, 210 115, 240 125" fill="none" stroke="#A0AEC0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- T2 to Q -->
  <path d="M 170 185 C 210 185, 210 155, 240 145" fill="none" stroke="#A0AEC0" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Q to EDT -->
  <path d="M 400 135 L 470 135" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-accent)" />
  <!-- EDT to UI -->
  <path d="M 660 135 L 720 135" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Nodes -->
  <!-- Thread Node 1 -->
  <g transform="translate(30, 60)" filter="url(#shadow)">
    <rect class="thread-node" width="140" height="50" rx="8" />
    <text x="70" y="29" class="node-text">작업 스레드 A</text>
  </g>

  <!-- Thread Node 2 -->
  <g transform="translate(30, 160)" filter="url(#shadow)">
    <rect class="thread-node" width="140" height="50" rx="8" />
    <text x="70" y="29" class="node-text">작업 스레드 B</text>
  </g>

  <!-- Queue Node -->
  <g transform="translate(250, 95)" filter="url(#shadow)">
    <rect class="queue-node" width="150" height="80" rx="12" />
    <text x="75" y="38" class="node-text">이벤트 큐
      <tspan x="75" dy="18" class="node-subtext">(Event Queue)</tspan>
    </text>
  </g>

  <!-- EDT Node -->
  <g transform="translate(480, 105)" filter="url(#shadow)">
    <rect class="edt-node" width="180" height="60" rx="8" />
    <text x="90" y="28" class="node-text">이벤트 디스패칭 스레드
      <tspan x="90" dy="18" class="node-subtext">(EDT)</tspan>
    </text>
  </g>

  <!-- UI Node -->
  <g transform="translate(730, 110)" filter="url(#shadow)">
    <rect class="ui-node" width="140" height="50" rx="8" />
    <text x="70" y="29" class="node-text">UI 생성 및 변경</text>
  </g>

  <!-- Edge Labels -->
  <!-- T1 to Q Label -->
  <g transform="translate(205, 90)">
    <rect x="-30" y="-10" width="60" height="18" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text class="edge-text" y="3">Runnable</text>
  </g>
  <!-- T2 to Q Label -->
  <g transform="translate(205, 180)">
    <rect x="-30" y="-10" width="60" height="18" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text class="edge-text" y="3">Runnable</text>
  </g>
  <!-- Q to EDT Label -->
  <g transform="translate(435, 125)">
    <rect x="-30" y="-10" width="60" height="18" rx="4" fill="#FFFFFF" opacity="0.9"/>
    <text class="edge-text" y="3" fill="#4F46E5">순차 실행</text>
  </g>
</svg>

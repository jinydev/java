<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="380">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#000000" />
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3498DB" />
    </marker>
  </defs>

  <style>
    .window-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #FFFFFF; }
    .menu-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #2C3E50; }
    .btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #34495E; font-weight: bold; text-anchor: middle; }
    .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #7F8C8D; text-anchor: middle; }
    .action-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #3498DB; font-weight: bold; text-anchor: middle; }
    .window-border { stroke: #BDC3C7; stroke-width: 2; fill: #FFFFFF; }
    .dock-bar { fill: #F2F4F4; stroke: #BDC3C7; stroke-width: 1; }
    .tool-btn { fill: #FFFFFF; stroke: #BDC3C7; stroke-width: 1; rx: 3; }
  </style>

  <!-- 1. Main JFrame Window -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="400" height="300" rx="8" class="window-border" />
    
    <!-- Title Bar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 392 0 A 8 8 0 0 1 400 8 L 400 28 L 0 28 Z" fill="#2C3E50" />
    <circle cx="15" cy="14" r="5" fill="#E74C3C" />
    <circle cx="30" cy="14" r="5" fill="#F1C40F" />
    <circle cx="45" cy="14" r="5" fill="#2ECC71" />
    <text x="200" y="18" class="window-title" text-anchor="middle">JFrame (BorderLayout)</text>

    <!-- Menu Bar -->
    <rect x="0" y="28" width="400" height="22" fill="#EAEDED" stroke="#BDC3C7" stroke-width="1" />
    <text x="15" y="43" class="menu-text">파일(F)</text>
    <text x="60" y="43" class="menu-text">편집(E)</text>
    <text x="105" y="43" class="menu-text">도움말(H)</text>

    <!-- Docked JToolBar (BorderLayout.NORTH) -->
    <rect x="0" y="50" width="400" height="36" class="dock-bar" />
    <!-- Texture/Grip lines to show drag area -->
    <line x1="6" y1="56" x2="6" y2="80" stroke="#7F8C8D" stroke-dasharray="2 2" stroke-width="2" />
    <line x1="9" y1="56" x2="9" y2="80" stroke="#7F8C8D" stroke-dasharray="2 2" stroke-width="2" />
    
    <!-- Buttons -->
    <g transform="translate(20, 56)">
      <rect width="32" height="24" class="tool-btn" />
      <text x="16" y="15" class="btn-text">New</text>
    </g>
    <g transform="translate(58, 56)">
      <rect width="32" height="24" class="tool-btn" />
      <text x="16" y="15" class="btn-text">Save</text>
    </g>
    
    <!-- Separator -->
    <line x1="98" y1="56" x2="98" y2="80" stroke="#BDC3C7" stroke-width="1" />

    <g transform="translate(106, 56)">
      <rect width="32" height="24" class="tool-btn" />
      <text x="16" y="15" class="btn-text">Copy</text>
    </g>
    <g transform="translate(144, 56)">
      <rect width="32" height="24" class="tool-btn" />
      <text x="16" y="15" class="btn-text">Paste</text>
    </g>

    <!-- Content Area (BorderLayout.CENTER) -->
    <rect x="0" y="86" width="400" height="214" fill="#FAFAFA" />
    <text x="200" y="180" class="label-text">Main Content Area (JTextArea / Canvas)</text>
    <text x="200" y="200" class="label-text" style="font-size: 10px; fill: #BDC3C7;">BorderLayout.CENTER</text>
  </g>

  <!-- 2. Floating JToolBar Window -->
  <g transform="translate(490, 100)" filter="url(#shadow)">
    <!-- Floating Window Frame -->
    <rect width="160" height="70" rx="6" fill="#FFFFFF" stroke="#3498DB" stroke-width="1.5" />
    
    <!-- Mini Title Bar -->
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 154 0 A 6 6 0 0 1 160 6 L 160 20 L 0 20 Z" fill="#3498DB" />
    <text x="80" y="14" class="window-title" style="font-size: 9px;" text-anchor="middle">JToolBar (Floating)</text>

    <!-- Floating Content / Buttons -->
    <rect x="0" y="20" width="160" height="50" fill="#F8F9F9" rx="2" />
    <g transform="translate(15, 33)">
      <rect width="38" height="24" class="tool-btn" />
      <text x="19" y="15" class="btn-text">New</text>
    </g>
    <g transform="translate(60, 33)">
      <rect width="38" height="24" class="tool-btn" />
      <text x="19" y="15" class="btn-text">Save</text>
    </g>
    <g transform="translate(105, 33)">
      <rect width="38" height="24" class="tool-btn" />
      <text x="19" y="15" class="btn-text">Copy</text>
    </g>
  </g>

  <!-- 3. Drag Action Path / Annotation -->
  <path d="M 230 110 C 310 110, 400 90, 480 120" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="310" y="80" width="110" height="20" rx="4" fill="#3498DB" opacity="0.9" />
  <text x="365" y="94" class="window-title" style="font-size: 9px;" text-anchor="middle">Drag &amp; Float</text>
</svg>

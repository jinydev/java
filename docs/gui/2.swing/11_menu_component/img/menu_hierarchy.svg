<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="380">
  <style>
    .class-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #1A202C; text-anchor: middle; }
    .class-box { stroke-width: 2; }
    .base-box { fill: #EDF2F7; stroke: #4A5568; }
    .middle-box { fill: #EFF6FF; stroke: #3B82F6; }
    .concrete-box { fill: #F0FDF4; stroke: #22C55E; }
    .relation-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
  </style>

  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
    <!-- Inheritance Arrow Marker -->
    <marker id="inheritance" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Connectors -->
  <!-- JComponent to JMenuBar -->
  <path class="relation-line" d="M 350 60 L 350 80 L 145 80 L 145 100" marker-end="url(#inheritance)" />

  <!-- JComponent to JPopupMenu -->
  <path class="relation-line" d="M 350 80 L 290 80 L 290 100" marker-end="url(#inheritance)" />

  <!-- JComponent to AbstractButton -->
  <path class="relation-line" d="M 350 80 L 490 80 L 490 100" marker-end="url(#inheritance)" />

  <!-- AbstractButton to JMenuItem -->
  <path class="relation-line" d="M 490 150 L 490 180" marker-end="url(#inheritance)" />

  <!-- JMenuItem to JMenu -->
  <path class="relation-line" d="M 490 230 L 490 250 L 305 250 L 305 270" marker-end="url(#inheritance)" />

  <!-- JMenuItem to JCheckBoxMenuItem -->
  <path class="relation-line" d="M 490 250 L 462 250 L 462 270" marker-end="url(#inheritance)" />

  <!-- JMenuItem to JRadioButtonMenuItem -->
  <path class="relation-line" d="M 490 250 L 620 250 L 620 270" marker-end="url(#inheritance)" />

  <!-- JComponent Node -->
  <g transform="translate(275, 20)" filter="url(#shadow)">
    <rect class="class-box base-box" width="150" height="40" rx="6" />
    <text x="75" y="24" class="class-name">JComponent</text>
  </g>

  <!-- JMenuBar Node -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="130" height="50" rx="6" />
    <text x="65" y="29" class="class-name">JMenuBar</text>
  </g>

  <!-- JPopupMenu Node -->
  <g transform="translate(225, 100)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="130" height="50" rx="6" />
    <text x="65" y="29" class="class-name">JPopupMenu</text>
  </g>

  <!-- AbstractButton Node -->
  <g transform="translate(410, 100)" filter="url(#shadow)">
    <rect class="class-box base-box" width="160" height="50" rx="6" />
    <text x="80" y="29" class="class-name">AbstractButton</text>
  </g>

  <!-- JMenuItem Node -->
  <g transform="translate(410, 180)" filter="url(#shadow)">
    <rect class="class-box middle-box" width="160" height="50" rx="6" />
    <text x="80" y="29" class="class-name" fill="#1D4ED8">JMenuItem</text>
  </g>

  <!-- JMenu Node -->
  <g transform="translate(240, 270)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="130" height="50" rx="6" />
    <text x="65" y="29" class="class-name">JMenu</text>
  </g>

  <!-- JCheckBoxMenuItem Node -->
  <g transform="translate(385, 270)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="155" height="50" rx="6" />
    <text x="77.5" y="29" class="class-name">JCheckBoxMenuItem</text>
  </g>

  <!-- JRadioButtonMenuItem Node -->
  <g transform="translate(550, 270)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="140" height="50" rx="6" />
    <text x="70" y="29" class="class-name">JRadioButtonMenuItem</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="400" fill="#f4f6f8" rx="15" />
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">스레드 풀 (인력 사무소) 비유 시각화</text>

  <!-- Task Queue (접수처) -->
  <g transform="translate(50, 100)">
    <rect width="180" height="250" fill="#fff" stroke="#1e88e5" stroke-width="2" rx="10"/>
    <rect width="180" height="40" fill="#e3f2fd" rx="10" />
    <path d="M 0 30 L 180 30 L 180 40 L 0 40 Z" fill="#e3f2fd" />
    <text x="90" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">접수처 (작업 큐)</text>

    <!-- Tasks -->
    <rect x="40" y="60" width="100" height="35" fill="#bbdefb" rx="5"/>
    <text x="90" y="82" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">작업 (Task) 1</text>
    
    <rect x="40" y="110" width="100" height="35" fill="#bbdefb" rx="5"/>
    <text x="90" y="132" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">작업 (Task) 2</text>

    <rect x="40" y="160" width="100" height="35" fill="#bbdefb" rx="5"/>
    <text x="90" y="182" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">작업 (Task) 3</text>
    
    <text x="90" y="220" font-family="Arial" font-size="18" fill="#1565c0" text-anchor="middle">...</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 230 200 L 270 200" fill="none" stroke="#666" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="250" y="190" font-family="Arial" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">할당</text>

  <!-- Thread Pool (대기실) -->
  <g transform="translate(280, 100)">
    <rect width="470" height="250" fill="#fff" stroke="#43a047" stroke-width="2" rx="10"/>
    <rect width="470" height="40" fill="#e8f5e9" rx="10" />
    <path d="M 0 30 L 470 30 L 470 40 L 0 40 Z" fill="#e8f5e9" />
    <text x="235" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">스레드 풀 (직원 대기실 / 작업장)</text>

    <!-- Worker 1 (Working) -->
    <g transform="translate(30, 60)">
      <rect width="410" height="40" fill="#f1f8e9" stroke="#81c784" stroke-width="1" rx="5"/>
      <circle cx="30" cy="20" r="15" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">T1</text>
      <rect x="70" y="10" width="80" height="20" fill="#bbdefb" rx="3"/>
      <text x="110" y="24" font-family="Arial" font-size="11" fill="#1565c0" text-anchor="middle">작업 처리중...</text>
      
      <path d="M 160 20 C 220 20, 240 -10, 300 20" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
      <text x="230" y="8" font-family="Arial" font-size="11" fill="#2e7d32" text-anchor="middle">작업 완료 후 복귀 (재사용)</text>
      <circle cx="380" cy="20" r="15" fill="#fff" stroke="#4caf50" stroke-width="2" stroke-dasharray="2,2"/>
    </g>

    <!-- Worker 2 (Working) -->
    <g transform="translate(30, 115)">
      <rect width="410" height="40" fill="#f1f8e9" stroke="#81c784" stroke-width="1" rx="5"/>
      <circle cx="30" cy="20" r="15" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">T2</text>
      <rect x="70" y="10" width="80" height="20" fill="#bbdefb" rx="3"/>
      <text x="110" y="24" font-family="Arial" font-size="11" fill="#1565c0" text-anchor="middle">작업 처리중...</text>
    </g>

    <!-- Worker 3 (Resting) -->
    <g transform="translate(30, 170)">
      <rect width="410" height="40" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="5"/>
      <circle cx="30" cy="20" r="15" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
      <text x="30" y="25" font-family="Arial" font-size="12" font-weight="bold" fill="#666" text-anchor="middle">T3</text>
      <text x="110" y="24" font-family="Arial" font-size="12" fill="#9e9e9e" text-anchor="middle">대기실에서 휴식 중...</text>
    </g>
    
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>

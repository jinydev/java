<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="450" fill="#fcfcfc" rx="15" />
  
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#006064" text-anchor="middle">인력 사무소 (스레드 풀) 아키텍처 동작 원리</text>

  <!-- Main Thread -->
  <circle cx="100" cy="225" r="40" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="100" y="230" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">고객</text>
  <text x="100" y="280" font-family="Arial" font-size="14" fill="#c62828" text-anchor="middle">(메인 스레드)</text>
  <text x="100" y="300" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">"일거리 접수요!"</text>
  
  <path d="M 150 225 L 230 225" fill="none" stroke="#666" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="190" y="215" font-family="monospace" font-size="14" fill="#666" text-anchor="middle">submit()</text>

  <!-- Task Queue (Conveyor Belt) -->
  <rect x="250" y="100" width="150" height="250" fill="#fff" stroke="#f57c00" stroke-width="3" rx="10"/>
  <text x="325" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#f57c00" text-anchor="middle">접수처</text>
  <text x="325" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">(작업 큐)</text>
  
  <rect x="275" y="170" width="100" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="325" y="195" font-family="Arial" font-size="14" fill="#e65100" text-anchor="middle">Task 1</text>
  <rect x="275" y="220" width="100" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="325" y="245" font-family="Arial" font-size="14" fill="#e65100" text-anchor="middle">Task 2</text>
  <rect x="275" y="270" width="100" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="5"/>
  <text x="325" y="295" font-family="Arial" font-size="14" fill="#e65100" text-anchor="middle">Task 3...</text>

  <!-- Fetching Task -->
  <path d="M 400 200 L 530 160" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 400 240 L 530 240" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 400 280 L 530 320" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-blue)"/>
  
  <!-- Thread Pool -->
  <rect x="550" y="80" width="220" height="300" fill="#f4fffc" stroke="#00695c" stroke-width="4" rx="10"/>
  <text x="660" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#00695c" text-anchor="middle">인력 사무소</text>
  <text x="660" y="130" font-family="Arial" font-size="14" font-weight="bold" fill="#00695c" text-anchor="middle">(대기실 / 스레드 풀)</text>

  <!-- Threads -->
  <circle cx="660" cy="180" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="660" y="185" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 1</text>
  <circle cx="600" cy="260" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="600" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 2</text>
  <circle cx="720" cy="260" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="720" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 3</text>
  <circle cx="660" cy="330" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="660" y="335" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 4</text>
  
  <text x="780" y="255" font-family="Arial" font-size="14" fill="#666" text-anchor="middle" writing-mode="vertical-rl">일이 끝나면 해고되지 않고 대기실로 복귀!</text>
  <path d="M 720 180 Q 750 200 740 230" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)" stroke-dasharray="4,4"/>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>

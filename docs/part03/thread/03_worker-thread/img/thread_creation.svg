<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="350" fill="#f8f9fa" rx="15" />
  
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">작업 스레드를 생성하는 두 가지 방법 (비유)</text>

  <!-- Method 1: Runnable -->
  <g transform="translate(40, 70)">
    <rect width="340" height="250" fill="#fff" stroke="#1e88e5" stroke-width="2" rx="10"/>
    <rect width="340" height="40" fill="#e3f2fd" rx="10" />
    <path d="M 0 30 L 340 30 L 340 40 L 0 40 Z" fill="#e3f2fd" />
    <text x="170" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">방법 1: Runnable 인터페이스 구현</text>
    
    <text x="170" y="65" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">"일반 일꾼에게 업무 매뉴얼을 쥐어주기"</text>

    <!-- Runnable Manual -->
    <rect x="30" y="90" width="100" height="130" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="5"/>
    <text x="80" y="120" font-family="Arial" font-size="14" font-weight="bold" fill="#f57f17" text-anchor="middle">Runnable</text>
    <line x1="45" y1="140" x2="115" y2="140" stroke="#f57f17" stroke-width="2"/>
    <line x1="45" y1="160" x2="115" y2="160" stroke="#f57f17" stroke-width="2"/>
    <text x="80" y="195" font-family="Arial" font-size="12" fill="#f57f17" text-anchor="middle">(업무 매뉴얼)</text>

    <!-- Plus sign -->
    <text x="150" y="165" font-family="Arial" font-size="24" font-weight="bold" fill="#777" text-anchor="middle">+</text>

    <!-- Thread Worker -->
    <circle cx="230" cy="135" r="35" fill="#bbdefb" stroke="#1e88e5" stroke-width="2"/>
    <text x="230" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">Thread</text>
    <text x="230" y="195" font-family="Arial" font-size="12" fill="#1565c0" text-anchor="middle">(일꾼)</text>

    <!-- Code Snippet -->
    <rect x="20" y="230" width="300" height="30" fill="#f5f5f5" rx="5"/>
    <text x="170" y="250" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">new Thread(new Runnable())</text>
  </g>

  <!-- Method 2: Thread Inheritance -->
  <g transform="translate(420, 70)">
    <rect width="340" height="250" fill="#fff" stroke="#43a047" stroke-width="2" rx="10"/>
    <rect width="340" height="40" fill="#e8f5e9" rx="10" />
    <path d="M 0 30 L 340 30 L 340 40 L 0 40 Z" fill="#e8f5e9" />
    <text x="170" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">방법 2: Thread 클래스 상속</text>

    <text x="170" y="65" font-family="Arial" font-size="14" fill="#555" text-anchor="middle">"업무를 이미 숙지한 전문가 고용하기"</text>

    <!-- Thread Specialist -->
    <circle cx="170" cy="140" r="45" fill="#c8e6c9" stroke="#43a047" stroke-width="2"/>
    <!-- Specialist Star -->
    <path d="M 170 100 L 175 110 L 185 110 L 178 117 L 180 127 L 170 122 L 160 127 L 162 117 L 155 110 L 165 110 Z" fill="#fbc02d"/>
    <text x="170" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">WorkerThread</text>
    <text x="170" y="165" font-family="Arial" font-size="12" fill="#2e7d32" text-anchor="middle">(전문가 일꾼)</text>
    
    <rect x="65" y="185" width="210" height="25" fill="#f1f8e9" rx="5"/>
    <text x="170" y="202" font-family="Arial" font-size="12" fill="#2e7d32" text-anchor="middle">매뉴얼이 내장되어 있음 (run 오버라이딩)</text>

    <!-- Code Snippet -->
    <rect x="20" y="230" width="300" height="30" fill="#f5f5f5" rx="5"/>
    <text x="170" y="250" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">new WorkerThread()</text>
  </g>
</svg>

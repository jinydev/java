<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="650" height="350" fill="#f8f9fa" rx="10" />
  
  <text x="325" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">동기화 (Synchronization) 공용 화장실 비유</text>

  <!-- Waiting Queue -->
  <g transform="translate(50, 80)">
    <rect width="200" height="220" fill="#fff" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
    <text x="100" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#616161" text-anchor="middle">화장실 밖 (대기줄)</text>

    <!-- Thread B -->
    <rect x="30" y="60" width="140" height="50" fill="#ffebee" stroke="#e53935" stroke-width="2" rx="5"/>
    <text x="100" y="80" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">스레드 B</text>
    <text x="100" y="100" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">기다리는 중...</text>

    <!-- Thread C -->
    <rect x="30" y="130" width="140" height="50" fill="#ffebee" stroke="#e53935" stroke-width="2" rx="5"/>
    <text x="100" y="150" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">스레드 C</text>
    <text x="100" y="170" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">기다리는 중...</text>
  </g>

  <!-- Synchronized Object (Toilet) -->
  <g transform="translate(380, 80)">
    <rect width="220" height="220" fill="#fff" stroke="#fbc02d" stroke-width="4" rx="10"/>
    <rect width="220" height="40" fill="#fff9c4" rx="10"/>
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#fff9c4" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#f57f17" text-anchor="middle">공유 객체 (공용 화장실)</text>

    <!-- Lock Icon -->
    <rect x="95" y="55" width="30" height="20" fill="#f57f17" rx="3"/>
    <path d="M 102 55 L 102 45 C 102 38, 118 38, 118 45 L 118 55" fill="none" stroke="#f57f17" stroke-width="4"/>
    <text x="110" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#f57f17" text-anchor="middle">문 잠김 (Lock 획득)</text>

    <!-- Thread A inside -->
    <rect x="40" y="110" width="140" height="70" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="5"/>
    <text x="110" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">스레드 A</text>
    <text x="110" y="160" font-family="Arial" font-size="14" fill="#2e7d32" text-anchor="middle">사용 중! 🚽</text>
  </g>

  <!-- Arrows -->
  <path d="M 250 135 C 310 135, 310 115, 370 115" fill="none" stroke="#d32f2f" stroke-width="3" stroke-dasharray="6,6" marker-end="url(#arrow-red)"/>
  <text x="315" y="110" font-family="Arial" font-size="12" font-weight="bold" fill="#d32f2f" text-anchor="middle">접근 불가!</text>

  <path d="M 490 300 C 490 330, 420 330, 390 330" fill="none" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="490" y="340" font-family="Arial" font-size="12" font-weight="bold" fill="#388e3c" text-anchor="middle">사용 완료 후 Lock 반납 🔓</text>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c" />
    </marker>
  </defs>
</svg>

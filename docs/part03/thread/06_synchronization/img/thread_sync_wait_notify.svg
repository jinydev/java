<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="900" height="450" fill="#fcfcfc" rx="15" />
  
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">wait() &amp; notify()를 이용한 완벽한 교대 작업 (핑퐁)</text>

  <!-- Shared Object Area -->
  <rect x="250" y="80" width="400" height="240" fill="#fff" stroke="#1565c0" stroke-width="4" rx="10"/>
  <rect x="380" y="65" width="140" height="30" fill="#1565c0" rx="5"/>
  <text x="450" y="85" font-family="monospace" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">synchronized 영역</text>

  <!-- Worker A Leaving -->
  <circle cx="350" cy="180" r="30" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="350" y="185" font-family="Arial" font-size="18" font-weight="bold" fill="#c62828" text-anchor="middle">스레드 A</text>
  
  <path d="M 350 220 L 350 330 L 200 330" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-red)"/>
  <text x="270" y="320" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">"내 차례 끝! 대기실로 (wait)"</text>

  <!-- Wait Room -->
  <rect x="50" y="270" width="150" height="120" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="10"/>
  <text x="125" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="#666" text-anchor="middle">대기실 (Waiting)</text>
  <text x="125" y="330" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">notify가 올때까지</text>
  <text x="125" y="350" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">깊은 잠에 빠짐...</text>

  <!-- Notify Signal -->
  <path d="M 380 180 C 450 150, 450 150, 520 180" fill="none" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="400" y="130" width="100" height="30" fill="#fff3e0" stroke="#f57c00" stroke-width="1" rx="5"/>
  <text x="450" y="150" font-family="monospace" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">notify() 외침!</text>
  <text x="450" y="120" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">"대기실에 있는 애 나와!"</text>

  <!-- Worker B Entering -->
  <circle cx="550" cy="180" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="550" y="185" font-family="Arial" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">스레드 B</text>

  <path d="M 750 330 L 650 330 L 650 200 L 580 200" fill="none" stroke="#2e7d32" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow-green)"/>
  <text x="680" y="270" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">신호를 듣고 대기실에서</text>
  <text x="680" y="290" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">나와 작업 교대!</text>

  <!-- Right Wait Room (B came from here) -->
  <rect x="750" y="270" width="120" height="120" fill="#f5f5f5" stroke="#999" stroke-width="2" rx="10"/>
  <text x="810" y="300" font-family="Arial" font-size="16" font-weight="bold" fill="#666" text-anchor="middle">대기실</text>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57c00" />
    </marker>
  </defs>
</svg>

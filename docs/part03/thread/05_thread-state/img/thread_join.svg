<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="450" fill="#fcfcfc" rx="15" />
  
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">스레드 join() 전체 흐름도 (start ➔ 병행 ➔ join ➔ 재개)</text>

  <!-- Labels for Time -->
  <text x="425" y="420" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">시간의 흐름 (Time) ➔</text>

  <!-- Main Thread Line (y=150) -->
  <!-- Phase 1: main only -->
  <line x1="100" y1="150" x2="250" y2="150" stroke="#1e88e5" stroke-width="6"/>
  <!-- Phase 2: parallel -->
  <line x1="250" y1="150" x2="450" y2="150" stroke="#1e88e5" stroke-width="6"/>
  <!-- Phase 3: paused -->
  <line x1="450" y1="150" x2="650" y2="150" stroke="#b0bec5" stroke-width="6" stroke-dasharray="8,8"/>
  <!-- Phase 4: resumed -->
  <line x1="650" y1="150" x2="800" y2="150" stroke="#1e88e5" stroke-width="6" marker-end="url(#arrow-blue)"/>
  
  <text x="80" y="155" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="end">메인 스레드</text>

  <!-- Thread B Line (y=320) -->
  <!-- Phase 2: parallel -->
  <line x1="250" y1="320" x2="450" y2="320" stroke="#43a047" stroke-width="6"/>
  <!-- Phase 3: solo -->
  <line x1="450" y1="320" x2="650" y2="320" stroke="#43a047" stroke-width="6"/>
  
  <text x="80" y="325" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="end">작업 스레드 B</text>

  <!-- 1. Start Point (Fork) -->
  <circle cx="250" cy="150" r="6" fill="#1e88e5"/>
  <path d="M 250 150 L 250 310" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dark)"/>
  <rect x="180" y="200" width="140" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="250" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#d32f2f" text-anchor="middle">threadB.start()</text>

  <!-- 2. Parallel Label -->
  <rect x="290" y="215" width="120" height="40" fill="#e3f2fd" rx="5"/>
  <text x="350" y="240" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">동시(병행) 실행</text>

  <!-- 3. Join Point -->
  <circle cx="450" cy="150" r="6" fill="#1e88e5"/>
  <path d="M 450 150 L 450 310" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dark)"/>
  <rect x="460" y="200" width="130" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="525" y="220" font-family="monospace" font-size="13" font-weight="bold" fill="#d32f2f" text-anchor="middle">threadB.join()</text>
  
  <rect x="370" y="90" width="160" height="40" fill="#ffebee" stroke="#e53935" stroke-width="2" rx="5"/>
  <text x="450" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">메인 스레드 일시 정지</text>

  <!-- 4. Thread B Solo Label -->
  <rect x="480" y="340" width="140" height="40" fill="#e8f5e9" stroke="#43a047" stroke-width="2" rx="5"/>
  <text x="550" y="365" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">스레드 B 단독 실행</text>

  <!-- 5. End Point (Merge/Resume) -->
  <circle cx="650" cy="320" r="6" fill="#43a047"/>
  <path d="M 650 320 L 650 160" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-dark)"/>
  <rect x="660" y="240" width="120" height="30" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
  <text x="720" y="260" font-family="Arial" font-size="13" font-weight="bold" fill="#d32f2f" text-anchor="middle">스레드 B 종료</text>

  <rect x="570" y="90" width="160" height="40" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" rx="5"/>
  <text x="650" y="115" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">메인 스레드 깨어남</text>
  <circle cx="650" cy="150" r="6" fill="#1e88e5"/>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e88e5" />
    </marker>
  </defs>
</svg>

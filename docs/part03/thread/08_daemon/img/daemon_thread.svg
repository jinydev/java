<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="750" height="350" fill="#fcfcfc" rx="15" />
  
  <text x="375" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">데몬 스레드 비유 (정규직과 비서)</text>

  <!-- Left: Main Thread -->
  <g transform="translate(100, 90)">
    <rect width="220" height="200" fill="#fff" stroke="#1e88e5" stroke-width="2" rx="10"/>
    <rect width="220" height="40" fill="#e3f2fd" rx="10" />
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#e3f2fd" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">주 스레드 (Main Thread)</text>

    <!-- Main Worker -->
    <circle cx="110" cy="110" r="40" fill="#bbdefb" stroke="#1e88e5" stroke-width="2"/>
    <text x="110" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">정규직</text>
    
    <text x="110" y="170" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">본인 업무가 끝날 때까지</text>
    <text x="110" y="190" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">절대 퇴근하지 않음</text>
  </g>

  <!-- Right: Daemon Thread -->
  <g transform="translate(430, 90)">
    <rect width="220" height="200" fill="#fff" stroke="#8e24aa" stroke-width="2" rx="10"/>
    <rect width="220" height="40" fill="#f3e5f5" rx="10" />
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#f3e5f5" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#7b1fa2" text-anchor="middle">데몬 스레드 (Daemon Thread)</text>

    <!-- Assistant Worker -->
    <circle cx="110" cy="110" r="40" fill="#e1bee7" stroke="#8e24aa" stroke-width="2"/>
    <text x="110" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#7b1fa2" text-anchor="middle">비서(보조)</text>
    
    <text x="110" y="170" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">정규직이 퇴근하면</text>
    <text x="110" y="190" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">따라서 자동으로 퇴근함</text>
  </g>

  <!-- Connection / Relationship -->
  <path d="M 320 160 C 350 160, 390 160, 430 160" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="330" y="145" width="90" height="25" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="375" y="162" font-family="monospace" font-size="12" fill="#555" text-anchor="middle">setDaemon(true)</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>
</svg>

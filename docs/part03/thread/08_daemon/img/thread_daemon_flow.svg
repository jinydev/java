<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="350" fill="#fcfcfc" rx="15" />
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">데몬 스레드의 라이프사이클 (강제 종료)</text>

  <!-- Main Thread Timeline -->
  <text x="120" y="100" font-family="Arial" font-size="18" font-weight="bold" fill="#c62828">정규직 (메인 스레드)</text>
  <rect x="120" y="120" width="400" height="40" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="5"/>
  <text x="320" y="145" font-family="Arial" font-size="16" fill="#c62828" text-anchor="middle">작업 중 (3초 대기)</text>
  
  <!-- Main Thread Ends -->
  <path d="M 520 120 L 520 160" stroke="#c62828" stroke-width="4"/>
  <text x="530" y="135" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828">메인 스레드 종료</text>
  <text x="530" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828">(퇴근!)</text>

  <!-- Vertical Cut Line -->
  <path d="M 520 160 L 520 300" stroke="#d32f2f" stroke-width="3" stroke-dasharray="10,5" opacity="0.6"/>
  <text x="530" y="220" font-family="Arial" font-size="24" fill="#d32f2f">✂️</text>

  <!-- Daemon Thread Timeline -->
  <text x="120" y="230" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0">비서 (데몬 스레드)</text>
  <rect x="120" y="250" width="400" height="40" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="5"/>
  <text x="320" y="275" font-family="Arial" font-size="16" fill="#1565c0" text-anchor="middle">무한 루프 작업 중... (while true)</text>
  
  <!-- Daemon Thread Forced to Stop -->
  <path d="M 520 250 L 520 290" stroke="#1565c0" stroke-width="4"/>
  <text x="540" y="265" font-family="Arial" font-size="16" font-weight="bold" fill="#d32f2f">강제 종료 (자동 퇴근)</text>
  <text x="540" y="285" font-family="Arial" font-size="14" fill="#666">"앗, 아직 일 안 끝났는데..."</text>
  
  <!-- Faded Continuation indicating it would have continued -->
  <rect x="520" y="250" width="200" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5" rx="5" opacity="0.5"/>
  <text x="620" y="275" font-family="Arial" font-size="14" fill="#999" text-anchor="middle">원래는 계속 해야 함</text>
  
  <!-- Connection Arrow -->
  <path d="M 120 170 L 120 210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="130" y="195" font-family="monospace" font-size="14" fill="#666">setDaemon(true) &amp; start()</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="350" fill="#fcfcfc" rx="15" />
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">스레드 상태 제어 비유 (sleep, join, yield)</text>

  <!-- 1. sleep() -->
  <g transform="translate(40, 80)">
    <rect width="220" height="230" fill="#fff" stroke="#1e88e5" stroke-width="2" rx="10"/>
    <rect width="220" height="40" fill="#e3f2fd" rx="10" />
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#e3f2fd" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">sleep() : 낮잠/휴식</text>
    
    <text x="110" y="65" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">"지정된 시간 동안 일시 정지"</text>

    <!-- Sleeping Worker -->
    <circle cx="110" cy="140" r="35" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="2"/>
    <text x="110" y="145" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">일꾼 A</text>
    <text x="145" y="110" font-family="Arial" font-size="16" font-weight="bold" fill="#1e88e5">Z</text>
    <text x="155" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#1e88e5">z</text>
    <text x="165" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#1e88e5">z</text>

    <!-- Clock -->
    <circle cx="65" cy="115" r="15" fill="#fff" stroke="#1565c0" stroke-width="2"/>
    <path d="M 65 105 L 65 115 L 75 115" fill="none" stroke="#1565c0" stroke-width="2"/>

    <rect x="20" y="200" width="180" height="25" fill="#f5f5f5" rx="5"/>
    <text x="110" y="217" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">Thread.sleep(1000);</text>
  </g>

  <!-- 2. join() -->
  <g transform="translate(290, 80)">
    <rect width="220" height="230" fill="#fff" stroke="#43a047" stroke-width="2" rx="10"/>
    <rect width="220" height="40" fill="#e8f5e9" rx="10" />
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#e8f5e9" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">join() : 동료 기다림</text>
    
    <text x="110" y="65" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">"다른 스레드 작업이 끝날 때까지 대기"</text>

    <!-- Waiting Worker A -->
    <circle cx="60" cy="140" r="30" fill="#c8e6c9" stroke="#43a047" stroke-width="2"/>
    <text x="60" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">일꾼 A</text>
    <text x="60" y="185" font-family="Arial" font-size="11" fill="#2e7d32" text-anchor="middle">(대기중...)</text>

    <!-- Working Worker B -->
    <circle cx="160" cy="140" r="30" fill="#bbdefb" stroke="#1e88e5" stroke-width="2"/>
    <text x="160" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">일꾼 B</text>

    <!-- Document passing -->
    <rect x="100" y="130" width="20" height="25" fill="#fff9c4" stroke="#fbc02d" stroke-width="1"/>
    <line x1="105" y1="135" x2="115" y2="135" stroke="#fbc02d" stroke-width="1"/>
    <line x1="105" y1="140" x2="115" y2="140" stroke="#fbc02d" stroke-width="1"/>
    
    <path d="M 130 140 L 105 140" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#arrow-green)"/>

    <rect x="20" y="200" width="180" height="25" fill="#f5f5f5" rx="5"/>
    <text x="110" y="217" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">threadB.join();</text>
  </g>

  <!-- 3. yield() -->
  <g transform="translate(540, 80)">
    <rect width="220" height="230" fill="#fff" stroke="#e53935" stroke-width="2" rx="10"/>
    <rect width="220" height="40" fill="#ffebee" rx="10" />
    <path d="M 0 30 L 220 30 L 220 40 L 0 40 Z" fill="#ffebee" />
    <text x="110" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">yield() : 실행 양보</text>
    
    <text x="110" y="65" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">"내 일이 무의미할 때 동료에게 양보"</text>

    <!-- CPU Area -->
    <rect x="60" y="85" width="100" height="30" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" rx="5"/>
    <text x="110" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">CPU (실행중)</text>

    <!-- Yielding Worker A -->
    <circle cx="60" cy="160" r="30" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
    <text x="60" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">일꾼 A</text>
    
    <!-- Working Worker B -->
    <circle cx="160" cy="160" r="30" fill="#c8e6c9" stroke="#43a047" stroke-width="2"/>
    <text x="160" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">일꾼 B</text>

    <!-- Yield arrows -->
    <path d="M 60 130 C 60 115, 80 115, 100 115" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="2,2"/>
    <path d="M 160 130 C 160 115, 120 115, 120 115" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-green)"/>
    
    <text x="60" y="145" font-family="Arial" font-size="20" fill="#e53935" text-anchor="middle">❌</text>
    <text x="110" y="150" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">양보!</text>

    <rect x="20" y="200" width="180" height="25" fill="#f5f5f5" rx="5"/>
    <text x="110" y="217" font-family="monospace" font-size="12" fill="#333" text-anchor="middle">Thread.yield();</text>
  </g>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>

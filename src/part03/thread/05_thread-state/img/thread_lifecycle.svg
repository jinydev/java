<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="750" height="350" fill="#fcfcfc" rx="15" />
  
  <text x="375" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">스레드 상태 변화 (Lifecycle)</text>

  <!-- States -->
  <!-- NEW -->
  <g transform="translate(50, 150)">
    <circle cx="45" cy="45" r="45" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3"/>
    <text x="45" y="40" font-family="Arial" font-size="16" font-weight="bold" fill="#6a1b9a" text-anchor="middle">NEW</text>
    <text x="45" y="60" font-family="Arial" font-size="12" fill="#6a1b9a" text-anchor="middle">객체 생성</text>
  </g>

  <!-- RUNNABLE -->
  <g transform="translate(240, 150)">
    <circle cx="45" cy="45" r="45" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3"/>
    <text x="45" y="40" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">RUNNABLE</text>
    <text x="45" y="60" font-family="Arial" font-size="12" fill="#1565c0" text-anchor="middle">실행 대기</text>
  </g>

  <!-- RUNNING -->
  <g transform="translate(430, 150)">
    <circle cx="45" cy="45" r="45" fill="#e8f5e9" stroke="#43a047" stroke-width="3"/>
    <text x="45" y="40" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">RUNNING</text>
    <text x="45" y="60" font-family="Arial" font-size="12" fill="#2e7d32" text-anchor="middle">실행 중</text>
  </g>

  <!-- TERMINATED -->
  <g transform="translate(620, 150)">
    <circle cx="45" cy="45" r="45" fill="#ffebee" stroke="#e53935" stroke-width="3"/>
    <text x="45" y="40" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">TERMINATED</text>
    <text x="45" y="60" font-family="Arial" font-size="12" fill="#c62828" text-anchor="middle">종료</text>
  </g>

  <!-- PAUSED -->
  <g transform="translate(335, 270)">
    <rect width="180" height="60" fill="#fff3e0" stroke="#fb8c00" stroke-width="3" rx="30"/>
    <text x="90" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">PAUSED (일시 정지)</text>
    <text x="90" y="45" font-family="Arial" font-size="12" fill="#e65100" text-anchor="middle">WAITING, BLOCKED 등</text>
  </g>

  <!-- Arrows & Transitions -->
  <!-- NEW to RUNNABLE -->
  <path d="M 140 195 L 230 195" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="185" font-family="Arial" font-size="12" font-weight="bold" fill="#444" text-anchor="middle">start()</text>

  <!-- RUNNABLE to RUNNING -->
  <path d="M 330 180 C 360 180, 390 180, 420 180" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="170" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">CPU 할당</text>

  <!-- RUNNING to RUNNABLE -->
  <path d="M 430 210 C 390 210, 370 210, 330 210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="225" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">yield() / 시간초과</text>

  <!-- RUNNING to TERMINATED -->
  <path d="M 520 195 L 610 195" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="185" font-family="Arial" font-size="12" font-weight="bold" fill="#444" text-anchor="middle">run() 종료</text>

  <!-- RUNNING to PAUSED -->
  <path d="M 490 235 C 490 260, 460 270, 425 270" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="545" y="260" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">sleep(), wait() 등</text>

  <!-- PAUSED to RUNNABLE -->
  <path d="M 335 300 C 270 300, 270 240, 270 235" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="280" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">시간종료, notify()</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="450" fill="#fcfcfc" rx="15" />
  <line x1="425" y1="20" x2="425" y2="430" stroke="#ddd" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- LEFT: Platform Thread -->
  <text x="212" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d32f2f" text-anchor="middle">기존: 플랫폼 스레드 (1:1 매핑)</text>
  <rect x="50" y="60" width="324" height="40" fill="#ffebee" rx="5"/>
  <text x="212" y="85" font-family="Arial" font-size="14" fill="#c62828" text-anchor="middle">택배(I/O)를 기다릴 때 통째로 멍때림 (CPU 낭비)</text>

  <!-- OS Thread -->
  <rect x="110" y="320" width="200" height="60" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="3" rx="10"/>
  <text x="210" y="355" font-family="Arial" font-size="18" font-weight="bold" fill="#616161" text-anchor="middle">OS 스레드 (물리적 자원)</text>

  <line x1="210" y1="320" x2="210" y2="230" stroke="#616161" stroke-width="4" stroke-dasharray="5,5"/>

  <!-- Platform Thread -->
  <rect x="110" y="150" width="200" height="80" fill="#ffcdd2" stroke="#d32f2f" stroke-width="3" rx="10"/>
  <text x="210" y="180" font-family="Arial" font-size="16" font-weight="bold" fill="#b71c1c" text-anchor="middle">정규직 (플랫폼 스레드)</text>
  <text x="210" y="210" font-family="Arial" font-size="14" fill="#b71c1c" text-anchor="middle">"택배 언제 오지..." 💤</text>

  <!-- Blocked Task -->
  <rect x="150" y="110" width="120" height="30" fill="#fff" stroke="#d32f2f" stroke-width="2" rx="5"/>
  <text x="210" y="130" font-family="Arial" font-size="12" fill="#d32f2f" text-anchor="middle">작업 (I/O 대기 중)</text>

  <text x="320" y="190" font-family="Arial" font-size="24" fill="#d32f2f">⛔ 블로킹</text>


  <!-- RIGHT: Virtual Thread -->
  <text x="637" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1565c0" text-anchor="middle">가상 스레드 (M:N 매핑)</text>
  <rect x="475" y="60" width="324" height="40" fill="#e3f2fd" rx="5"/>
  <text x="637" y="85" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">I/O 대기 시 교대 (Mount/Unmount)</text>

  <!-- OS Thread (Carrier) -->
  <rect x="530" y="320" width="200" height="60" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="3" rx="10"/>
  <text x="630" y="355" font-family="Arial" font-size="18" font-weight="bold" fill="#616161" text-anchor="middle">OS 스레드 (캐리어 스레드)</text>
  <text x="630" y="395" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">(정규직 관리자의 작업대)</text>

  <!-- Virtual Thread on Carrier -->
  <rect x="530" y="230" width="200" height="60" fill="#bbdefb" stroke="#1565c0" stroke-width="3" rx="10"/>
  <text x="630" y="255" font-family="Arial" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="middle">가상 스레드 2 (알바생 2)</text>
  <text x="630" y="275" font-family="Arial" font-size="12" fill="#0d47a1" text-anchor="middle">"열심히 일하는 중!" 🚀</text>

  <path d="M 630 320 L 630 290" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="660" y="310" font-family="monospace" font-size="14" font-weight="bold" fill="#1565c0">Mount (배치)</text>

  <!-- Waiting Room (Heap) -->
  <rect x="460" y="110" width="360" height="90" fill="#f5f5f5" stroke="#ccc" stroke-width="2" rx="10" stroke-dasharray="5,5"/>
  <text x="630" y="130" font-family="Arial" font-size="14" font-weight="bold" fill="#666" text-anchor="middle">힙 메모리 (대기석)</text>

  <!-- Virtual Thread waiting for I/O -->
  <rect x="480" y="145" width="140" height="40" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="550" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">가상 스레드 1</text>
  <text x="550" y="175" font-family="Arial" font-size="10" fill="#c62828" text-anchor="middle">(I/O 택배 대기 중 💤)</text>

  <path d="M 530 240 Q 500 210 500 185" fill="none" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="430" y="210" font-family="monospace" font-size="12" font-weight="bold" fill="#d32f2f">Unmount (대기실로)</text>

  <!-- Virtual Thread ready to work -->
  <rect x="640" y="145" width="140" height="40" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="710" y="160" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="middle">가상 스레드 3</text>
  <text x="710" y="175" font-family="Arial" font-size="10" fill="#2e7d32" text-anchor="middle">(다음 순서 대기 ✋)</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="450" fill="#f4fffc" rx="15" />
  
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#00695c" text-anchor="middle">방법 2. interrupt()를 이용한 안전 종료 (어깨 쳐서 깨우기)</text>

  <!-- Worker Area (Sleeping) -->
  <rect x="50" y="100" width="300" height="280" fill="#fff" stroke="#00695c" stroke-width="4" rx="10"/>
  <text x="200" y="130" font-family="Arial" font-size="18" font-weight="bold" fill="#00695c" text-anchor="middle">일꾼 스레드 (일시 정지)</text>

  <!-- Sleeping Worker -->
  <circle cx="150" cy="240" r="40" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="150" y="245" font-family="Arial" font-size="16" font-weight="bold" fill="#00838f" text-anchor="middle">쿨쿨 (sleep)</text>
  <text x="190" y="200" font-family="Arial" font-size="20" font-weight="bold" fill="#00838f">Zzz...</text>
  <text x="150" y="300" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">깃발을 볼 수 없는 상태!</text>

  <!-- Boss Interrupting -->
  <circle cx="450" cy="150" r="40" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="450" y="155" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">메인 스레드</text>
  
  <path d="M 400 160 L 250 200" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arrow-red)"/>
  <rect x="270" y="155" width="120" height="30" fill="#fff" stroke="#c62828" stroke-width="2" rx="5"/>
  <text x="330" y="175" font-family="monospace" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">interrupt()</text>
  <text x="330" y="145" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">"야, 일어나서 퇴근해!"</text>

  <!-- Exception Triggered -->
  <path d="M 180 260 L 200 280 L 190 310 L 170 290 Z" fill="#ffca28"/>
  <path d="M 200 240 Q 300 260 400 320" fill="none" stroke="#f57c00" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrow-orange)"/>
  <text x="300" y="260" font-family="Arial" font-size="14" font-weight="bold" fill="#ef6c00" text-anchor="middle">InterruptedException 발생!</text>

  <!-- Catch Block & Exit -->
  <rect x="420" y="290" width="180" height="80" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" rx="10"/>
  <text x="510" y="320" font-family="Arial" font-size="16" font-weight="bold" fill="#ef6c00" text-anchor="middle">catch 블록 진입</text>
  <text x="510" y="340" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">(자다가 깜짝 놀라서 깸)</text>

  <path d="M 600 330 L 650 330" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  
  <rect x="660" y="300" width="140" height="60" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10"/>
  <text x="730" y="325" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">짐 챙기기</text>
  <text x="730" y="345" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">안전 퇴근</text>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57c00" />
    </marker>
  </defs>
</svg>

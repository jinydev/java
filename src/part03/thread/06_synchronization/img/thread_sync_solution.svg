<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="400" fill="#f4fffc" rx="15" />
  
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#00695c" text-anchor="middle">동기화(synchronized) 적용 후 안정적인 상태</text>

  <!-- Restroom / Shared Object -->
  <rect x="250" y="100" width="300" height="250" fill="#fff" stroke="#00695c" stroke-width="5" rx="10"/>
  <text x="400" y="140" font-family="Arial" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">공용 화장실 (공유 객체)</text>
  
  <rect x="330" y="160" width="140" height="40" fill="#00695c" rx="5"/>
  <text x="400" y="185" font-family="monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">🔒 synchronized</text>

  <!-- Inside Worker -->
  <circle cx="400" cy="270" r="30" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="400" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0" text-anchor="middle">스레드 A</text>
  <text x="400" y="330" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">"안심하고 단독 사용 중!"</text>

  <!-- Waiting Worker -->
  <circle cx="120" cy="270" r="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="120" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#2e7d32" text-anchor="middle">스레드 B</text>
  
  <rect x="50" y="170" width="140" height="60" fill="#fff" stroke="#2e7d32" stroke-width="2" rx="5"/>
  <text x="120" y="200" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">"문이 잠겼네?"</text>
  <text x="120" y="220" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">"밖에서 기다려야지"</text>
  
  <text x="120" y="330" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828" text-anchor="middle">대기 중 (RUNNABLE)</text>

</svg>

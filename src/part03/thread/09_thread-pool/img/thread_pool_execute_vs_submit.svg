<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="850" height="450" fill="#fcfcfc" rx="15" />
  <line x1="425" y1="20" x2="425" y2="430" stroke="#ddd" stroke-width="2" stroke-dasharray="10,5"/>

  <!-- LEFT SIDE: execute -->
  <text x="212" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c62828" text-anchor="middle">1. execute (Runnable)</text>
  <rect x="50" y="60" width="324" height="40" fill="#ffebee" rx="5"/>
  <text x="212" y="85" font-family="Arial" font-size="14" fill="#c62828" text-anchor="middle">결과 반환 없음 / 예외 시 직원 해고 (오버헤드 발생)</text>

  <!-- Worker working -->
  <circle cx="212" cy="150" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="212" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 A</text>
  <text x="212" y="210" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">"일하는 중..."</text>

  <!-- Exception occurs -->
  <text x="280" y="130" font-family="Arial" font-size="30" text-anchor="middle">💥</text>
  <text x="320" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">예외 발생!</text>

  <!-- Fired -->
  <path d="M 212 230 L 212 280" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="212" y="320" font-family="Arial" font-size="40" text-anchor="middle">🪦</text>
  <text x="212" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">스레드 강제 종료 (해고)</text>

  <!-- New Hire -->
  <path d="M 120 370 Q 150 330 200 370" fill="none" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-orange)" stroke-dasharray="5,5"/>
  <text x="140" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">새 직원 채용</text>
  <circle cx="260" cy="380" r="20" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="260" y="385" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">신입</text>


  <!-- RIGHT SIDE: submit -->
  <text x="637" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1565c0" text-anchor="middle">2. submit (Callable/Runnable)</text>
  <rect x="475" y="60" width="324" height="40" fill="#e3f2fd" rx="5"/>
  <text x="637" y="85" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">Future 교환권 반환 / 예외 시 직원 재사용</text>

  <!-- Worker & Client -->
  <circle cx="637" cy="150" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="637" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 B</text>
  <text x="637" y="210" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">"일하는 중..."</text>

  <rect x="480" y="130" width="80" height="40" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="5"/>
  <text x="520" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#f57f17" text-anchor="middle">🎫 Future</text>
  <text x="520" y="185" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">결과 교환권</text>
  
  <path d="M 600 150 L 570 150" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Exception occurs -->
  <text x="705" y="130" font-family="Arial" font-size="30" text-anchor="middle">💥</text>
  <text x="745" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">예외 발생!</text>

  <!-- Saved / Reused -->
  <path d="M 637 230 L 637 280" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="637" y="320" font-family="Arial" font-size="40" text-anchor="middle">🩹</text>
  <text x="637" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">스레드 생존 (예외만 저장)</text>

  <!-- Return to pool -->
  <path d="M 637 360 Q 750 400 780 300" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="730" y="240" width="100" height="40" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="780" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">대기실 복귀</text>
  <text x="800" y="360" font-family="Arial" font-size="14" fill="#2e7d32" text-anchor="middle">재사용!</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57c00" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>

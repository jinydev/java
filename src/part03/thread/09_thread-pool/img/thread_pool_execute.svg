<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <rect width="500" height="400" fill="#fcfcfc" rx="15" />
  
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c62828" text-anchor="middle">1. execute (Runnable)</text>
  <rect x="50" y="60" width="400" height="40" fill="#ffebee" rx="5"/>
  <text x="250" y="85" font-family="Arial" font-size="14" fill="#c62828" text-anchor="middle">결과 반환 없음 / 예외 시 직원 해고 (오버헤드 발생)</text>

  <!-- Worker working -->
  <circle cx="250" cy="150" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="250" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 A</text>
  <text x="250" y="210" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">"일하는 중..."</text>

  <!-- Exception occurs -->
  <text x="320" y="130" font-family="Arial" font-size="30" text-anchor="middle">💥</text>
  <text x="360" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">예외 발생!</text>

  <!-- Fired -->
  <path d="M 250 230 L 250 280" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="250" y="320" font-family="Arial" font-size="40" text-anchor="middle">🪦</text>
  <text x="250" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#c62828" text-anchor="middle">스레드 강제 종료 (해고)</text>

  <!-- New Hire -->
  <path d="M 150 370 Q 200 330 240 370" fill="none" stroke="#f57c00" stroke-width="3" marker-end="url(#arrow-orange)" stroke-dasharray="5,5"/>
  <text x="170" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">새 직원 채용</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f57c00" />
    </marker>
  </defs>
</svg>

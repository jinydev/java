<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <rect width="500" height="400" fill="#fcfcfc" rx="15" />
  
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1565c0" text-anchor="middle">2. submit (Callable/Runnable)</text>
  <rect x="50" y="60" width="400" height="40" fill="#e3f2fd" rx="5"/>
  <text x="250" y="85" font-family="Arial" font-size="14" fill="#1565c0" text-anchor="middle">Future 교환권 반환 / 예외 시 직원 재사용</text>

  <!-- Worker & Client -->
  <circle cx="250" cy="150" r="30" fill="#e0f7fa" stroke="#00838f" stroke-width="3"/>
  <text x="250" y="155" font-family="Arial" font-size="14" font-weight="bold" fill="#00838f" text-anchor="middle">직원 B</text>
  <text x="250" y="210" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">"일하는 중..."</text>

  <rect x="70" y="130" width="80" height="40" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" rx="5"/>
  <text x="110" y="155" font-family="Arial" font-size="12" font-weight="bold" fill="#f57f17" text-anchor="middle">🎫 Future</text>
  <text x="110" y="185" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">결과 교환권</text>
  <path d="M 210 150 L 160 150" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Exception occurs -->
  <text x="320" y="130" font-family="Arial" font-size="30" text-anchor="middle">💥</text>
  <text x="360" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#d32f2f" text-anchor="middle">예외 발생!</text>

  <!-- Saved / Reused -->
  <path d="M 250 230 L 250 280" stroke="#666" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="250" y="320" font-family="Arial" font-size="40" text-anchor="middle">🩹</text>
  <text x="250" y="350" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">스레드 생존 (치료 후 재사용)</text>

  <!-- Return to pool -->
  <path d="M 250 360 Q 380 400 420 300" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="370" y="240" width="100" height="40" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="5"/>
  <text x="420" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">대기실 복귀</text>
  <text x="440" y="360" font-family="Arial" font-size="14" fill="#2e7d32" text-anchor="middle">재사용!</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="700" height="350" fill="#f8f9fa" rx="15" />
  
  <text x="350" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">싱글 스레드 vs 멀티 스레드 (일꾼 비유)</text>

  <!-- Single Thread Panel -->
  <g transform="translate(40, 70)">
    <rect width="280" height="240" fill="#fff" stroke="#ffb74d" stroke-width="2" rx="10"/>
    <rect width="280" height="40" fill="#fff3e0" rx="10" />
    <path d="M 0 30 L 280 30 L 280 40 L 0 40 Z" fill="#fff3e0" /> <!-- fix corner rounding -->
    <text x="140" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#e65100" text-anchor="middle">싱글 스레드 (혼자 일하기)</text>

    <!-- Worker -->
    <circle cx="50" cy="140" r="25" fill="#ffe0b2"/>
    <text x="50" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">일꾼 1명</text>
    
    <!-- Tasks (Sequential) -->
    <rect x="110" y="70" width="120" height="40" fill="#ffecb3" rx="5"/>
    <text x="170" y="95" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">1. 청소하기</text>

    <rect x="110" y="120" width="120" height="40" fill="#ffecb3" rx="5"/>
    <text x="170" y="145" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">2. 빨래하기</text>

    <rect x="110" y="170" width="120" height="40" fill="#ffecb3" rx="5"/>
    <text x="170" y="195" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">3. 요리하기</text>

    <!-- Path showing sequential movement -->
    <path d="M 75 140 C 90 90, 90 90, 110 90" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
    <path d="M 230 90 C 260 90, 260 140, 230 140" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
    <path d="M 110 140 C 80 140, 80 190, 110 190" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
  </g>

  <!-- Multi Thread Panel -->
  <g transform="translate(380, 70)">
    <rect width="280" height="240" fill="#fff" stroke="#64b5f6" stroke-width="2" rx="10"/>
    <rect width="280" height="40" fill="#e3f2fd" rx="10" />
    <path d="M 0 30 L 280 30 L 280 40 L 0 40 Z" fill="#e3f2fd" />
    <text x="140" y="26" font-family="Arial" font-size="16" font-weight="bold" fill="#1565c0" text-anchor="middle">멀티 스레드 (분업하기)</text>

    <!-- Workers & Tasks (Parallel) -->
    <!-- Worker A -->
    <circle cx="60" cy="90" r="20" fill="#bbdefb"/>
    <text x="60" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">일꾼 A</text>
    <path d="M 80 90 L 120 90" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="130" y="70" width="120" height="40" fill="#bbdefb" rx="5"/>
    <text x="190" y="95" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">청소하기</text>

    <!-- Worker B -->
    <circle cx="60" cy="140" r="20" fill="#bbdefb"/>
    <text x="60" y="145" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">일꾼 B</text>
    <path d="M 80 140 L 120 140" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="130" y="120" width="120" height="40" fill="#bbdefb" rx="5"/>
    <text x="190" y="145" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">빨래하기</text>

    <!-- Worker C -->
    <circle cx="60" cy="190" r="20" fill="#bbdefb"/>
    <text x="60" y="195" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">일꾼 C</text>
    <path d="M 80 190 L 120 190" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="130" y="170" width="120" height="40" fill="#bbdefb" rx="5"/>
    <text x="190" y="195" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">요리하기</text>

    <text x="140" y="230" font-family="Arial" font-size="12" font-weight="bold" fill="#d32f2f" text-anchor="middle">동시(병렬) 진행으로 시간 단축!</text>
  </g>

  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1565c0" />
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="380">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="dlgHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <marker id="popup-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #111827; }
    .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    .lbl-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #374151; }
    .val-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4b5563; }
    .btn-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .frame-border { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; filter: url(#shadow); }
    .dialog-border { fill: #ffffff; stroke: #f59e0b; stroke-width: 2; filter: url(#shadow); }
    .table-header { fill: #e5e7eb; stroke: #d1d5db; }
    .table-cell { fill: #ffffff; stroke: #e5e7eb; }
    .btn-action { fill: #3b82f6; stroke: #2563eb; rx: 4; cursor: pointer; }
    .btn-add { fill: #10b981; stroke: #059669; rx: 4; }
    .btn-dlg { fill: #f59e0b; stroke: #d97706; rx: 4; }
    .conn-line { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
  </style>

  <!-- Left Side: BoardApp Main Window (JFrame) -->
  <text x="20" y="30" class="title">1. 메인 게시판 UI 구조 (JFrame)</text>
  
  <g transform="translate(20, 50)">
    <!-- JFrame Base -->
    <rect class="frame-border" width="380" height="280" rx="8" />
    <!-- Title Bar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 372 0 A 8 8 0 0 1 380 8 L 380 25 L 0 25 Z" fill="url(#headerGrad)" />
    <text x="12" y="17" class="header-text">BoardApp (게시판 메인)</text>
    
    <!-- JTable inside JScrollPane -->
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="350" height="170" fill="#ffffff" stroke="#cbd5e1" />
      
      <!-- Table Columns -->
      <rect class="table-header" x="0" y="0" width="50" height="25" />
      <text x="15" y="17" class="lbl-text">번호</text>
      <rect class="table-header" x="50" y="0" width="160" height="25" />
      <text x="110" y="17" class="lbl-text">제목</text>
      <rect class="table-header" x="210" y="0" width="80" height="25" />
      <text x="235" y="17" class="lbl-text">글쓴이</text>
      <rect class="table-header" x="290" y="0" width="60" height="25" />
      <text x="305" y="17" class="lbl-text">조회수</text>
      
      <!-- Row 1 -->
      <rect class="table-cell" x="0" y="25" width="50" height="25" />
      <text x="20" y="42" class="val-text">1</text>
      <rect class="table-cell" x="50" y="25" width="160" height="25" />
      <text x="60" y="42" class="val-text">Swing은 정말 편리하네요!</text>
      <rect class="table-cell" x="210" y="25" width="80" height="25" />
      <text x="220" y="42" class="val-text">홍길동</text>
      <rect class="table-cell" x="290" y="25" width="60" height="25" />
      <text x="315" y="42" class="val-text">15</text>

      <!-- Row 2 -->
      <rect class="table-cell" x="0" y="50" width="50" height="25" />
      <text x="20" y="67" class="val-text">2</text>
      <rect class="table-cell" x="50" y="50" width="160" height="25" />
      <text x="60" y="67" class="val-text">JTable 이벤트 처리 실습</text>
      <rect class="table-cell" x="210" y="50" width="80" height="25" />
      <text x="220" y="67" class="val-text">임꺽정</text>
      <rect class="table-cell" x="290" y="50" width="60" height="25" />
      <text x="315" y="67" class="val-text">8</text>
    </g>

    <!-- South Panel (JPanel with FlowLayout) -->
    <g transform="translate(15, 225)">
      <rect x="0" y="0" width="350" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
      
      <!-- Buttons -->
      <g transform="translate(60, 10)">
        <rect class="btn-action btn-add" width="70" height="25" />
        <text x="35" y="17" class="btn-text">글쓰기</text>
      </g>
      <g transform="translate(140, 10)">
        <rect class="btn-action" width="70" height="25" />
        <text x="35" y="17" class="btn-text">수정</text>
      </g>
      <g transform="translate(220, 10)">
        <rect class="btn-action" style="fill:#ef4444; stroke:#dc2626;" width="70" height="25" />
        <text x="35" y="17" class="btn-text">삭제</text>
      </g>
    </g>
  </g>

  <!-- Connection line from 글쓰기 Button to Input Dialog -->
  <path class="conn-line" d="M 115 285 L 115 320 L 450 320 L 450 250" marker-end="url(#popup-arrow)" />

  <!-- Right Side: Input Dialog (JDialog) -->
  <text x="440" y="30" class="title">2. 글쓰기 입력 다이얼로그 (JDialog)</text>

  <g transform="translate(440, 50)">
    <!-- JDialog Base -->
    <rect class="dialog-border" width="280" height="190" rx="8" />
    <!-- Title Bar -->
    <path d="M 0 8 A 8 8 0 0 1 8 0 L 272 0 A 8 8 0 0 1 280 8 L 280 25 L 0 25 Z" fill="url(#dlgHeaderGrad)" />
    <text x="12" y="17" class="header-text">새 글 등록 (모달 다이얼로그)</text>
    
    <!-- Input Fields -->
    <g transform="translate(20, 45)">
      <!-- Title field -->
      <text x="0" y="15" class="lbl-text">제목:</text>
      <rect x="50" y="2" width="190" height="20" fill="#ffffff" stroke="#9ca3af" />
      
      <!-- Writer field -->
      <text x="0" y="45" class="lbl-text">작성자:</text>
      <rect x="50" y="32" width="190" height="20" fill="#ffffff" stroke="#9ca3af" />

      <!-- Content field -->
      <text x="0" y="75" class="lbl-text">내용:</text>
      <rect x="50" y="62" width="190" height="40" fill="#ffffff" stroke="#9ca3af" />
    </g>

    <!-- Dialog Buttons -->
    <g transform="translate(70, 155)">
      <rect class="btn-dlg" x="0" y="0" width="65" height="22" />
      <text x="32" y="14" class="btn-text">저장</text>
      
      <rect class="btn-dlg" style="fill:#9ca3af; stroke:#6b7280;" x="75" y="0" width="65" height="22" />
      <text x="107" y="14" class="btn-text">취소</text>
    </g>
  </g>

</svg>

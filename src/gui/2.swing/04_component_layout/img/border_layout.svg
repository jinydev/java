<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="300">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
  </defs>

  <style>
    .layout-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #2D3748; text-anchor: middle; }
    .north-south { fill: #EBF8FF; stroke: #90CDF4; stroke-width: 2; }
    .west-east { fill: #F5F3FF; stroke: #C7D2FE; stroke-width: 2; }
    .center-box { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 2; }
  </style>

  <!-- North -->
  <g transform="translate(20, 20)" filter="url(#shadow)">
    <rect class="north-south" width="460" height="50" rx="6" />
    <text x="230" y="30" class="layout-text" fill="#2B6CB0">NORTH (북쪽)</text>
  </g>

  <!-- West -->
  <g transform="translate(20, 80)" filter="url(#shadow)">
    <rect class="west-east" width="100" height="140" rx="6" />
    <text x="50" y="75" class="layout-text" fill="#5B21B6">WEST<tspan x="50" dy="18">(서쪽)</tspan></text>
  </g>

  <!-- Center -->
  <g transform="translate(130, 80)" filter="url(#shadow)">
    <rect class="center-box" width="240" height="140" rx="6" />
    <text x="120" y="75" class="layout-text" fill="#065F46">CENTER<tspan x="120" dy="18">(중앙)</tspan></text>
  </g>

  <!-- East -->
  <g transform="translate(380, 80)" filter="url(#shadow)">
    <rect class="west-east" width="100" height="140" rx="6" />
    <text x="50" y="75" class="layout-text" fill="#5B21B6">EAST<tspan x="50" dy="18">(동쪽)</tspan></text>
  </g>

  <!-- South -->
  <g transform="translate(20, 230)" filter="url(#shadow)">
    <rect class="north-south" width="460" height="50" rx="6" />
    <text x="230" y="30" class="layout-text" fill="#2B6CB0">SOUTH (남쪽)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="180">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.05" flood-color="#000000" />
    </filter>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
  </defs>

  <style>
    .container-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #374151; }
    .cell-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #1e40af; text-anchor: middle; }
    .grid-box { stroke: #3b82f6; stroke-width: 1.5; filter: url(#shadow); }
    .container-box { fill: #f9fafb; stroke: #d1d5db; stroke-width: 2; }
    .grid-line { stroke: #93c5fd; stroke-width: 1; stroke-dasharray: 3 3; }
  </style>

  <!-- Container Box -->
  <rect class="container-box" x="10" y="10" width="480" height="160" rx="8" />
  <text x="25" y="32" class="container-title">GridLayout Container (2 Rows x 3 Columns)</text>

  <!-- Grid division lines (dotted) -->
  <!-- Horizontal line dividing Row 1 & 2 -->
  <line x1="20" y1="102" x2="480" y2="102" class="grid-line" />
  <!-- Vertical lines dividing Column 1, 2, 3 -->
  <line x1="173" y1="45" x2="173" y2="160" class="grid-line" />
  <line x1="326" y1="45" x2="326" y2="160" class="grid-line" />

  <!-- Row 1 cells -->
  <g transform="translate(25, 50)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [0][0]</text>
  </g>

  <g transform="translate(181, 50)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [0][1]</text>
  </g>

  <g transform="translate(337, 50)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [0][2]</text>
  </g>

  <!-- Row 2 cells -->
  <g transform="translate(25, 110)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [1][0]</text>
  </g>

  <g transform="translate(181, 110)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [1][1]</text>
  </g>

  <g transform="translate(337, 110)">
    <rect class="grid-box" width="138" height="45" rx="4" fill="url(#gridGrad)" />
    <text x="69" y="27" class="cell-label">Cell [1][2]</text>
  </g>
</svg>

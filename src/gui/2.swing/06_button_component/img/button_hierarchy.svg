<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" width="100%" height="380">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
    <!-- Inheritance Arrow Marker -->
    <marker id="inheritance" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5" />
    </marker>
  </defs>

  <style>
    .class-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #1A202C; text-anchor: middle; }
    .member-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4A5568; }
    .class-box { stroke-width: 2; }
    .abstract-box { fill: #EDF2F7; stroke: #4A5568; }
    .concrete-box { fill: #EBF8FF; stroke: #3182CE; }
    .relation-line { stroke: #4A5568; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Connectors -->
  <!-- AbstractButton to JButton & JToggleButton -->
  <path class="relation-line" d="M 325 130 L 325 165 L 125 165 L 125 200" marker-end="url(#inheritance)" />
  <path class="relation-line" d="M 325 165 L 490 165 L 490 180" marker-end="url(#inheritance)" />

  <!-- JToggleButton to JCheckBox & JRadioButton -->
  <path class="relation-line" d="M 490 230 L 490 265 L 375 265 L 375 300" marker-end="url(#inheritance)" />
  <path class="relation-line" d="M 490 265 L 555 265 L 555 300" marker-end="url(#inheritance)" />

  <!-- AbstractButton Node -->
  <g transform="translate(200, 20)" filter="url(#shadow)">
    <rect class="class-box abstract-box" width="250" height="110" rx="8" />
    <text x="125" y="22" class="class-name" fill="#2D3748">&lt;&lt;Abstract&gt;&gt; AbstractButton</text>
    <line x1="0" y1="32" x2="250" y2="32" stroke="#4A5568" stroke-width="1" />
    <text x="15" y="50" class="member-text">+setText(String text)</text>
    <text x="15" y="65" class="member-text">+setIcon(Icon icon)</text>
    <text x="15" y="80" class="member-text">+addActionListener(ActionListener l)</text>
    <text x="15" y="95" class="member-text">+addItemListener(ItemListener l)</text>
  </g>

  <!-- JButton Node -->
  <g transform="translate(50, 200)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="150" height="50" rx="6" />
    <text x="75" y="29" class="class-name">JButton</text>
  </g>

  <!-- JToggleButton Node -->
  <g transform="translate(400, 180)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="180" height="50" rx="6" />
    <text x="90" y="29" class="class-name">JToggleButton</text>
  </g>

  <!-- JCheckBox Node -->
  <g transform="translate(300, 300)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="150" height="50" rx="6" />
    <text x="75" y="29" class="class-name">JCheckBox</text>
  </g>

  <!-- JRadioButton Node -->
  <g transform="translate(480, 300)" filter="url(#shadow)">
    <rect class="class-box concrete-box" width="150" height="50" rx="6" />
    <text x="75" y="29" class="class-name">JRadioButton</text>
  </g>
</svg>

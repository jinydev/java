<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="380">
  <defs>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.08" flood-color="#000000" />
    </filter>
    <linearGradient id="awtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <linearGradient id="swingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="osGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #111827; text-anchor: middle; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #4b5563; text-anchor: middle; }
    .box { stroke-width: 1.5; filter: url(#shadow); }
    .connector { stroke: #4B5563; stroke-width: 1.5; fill: none; }
    .group-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; fill: #4B5563; }
  </style>

  <!-- Left Side: AWT Architecture -->
  <text x="180" y="30" class="title">AWT Architecture (Heavyweight)</text>
  <rect x="20" y="50" width="320" height="300" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="35" y="70" class="group-label" fill="#ef4444">JVM &amp; OS-Dependent</text>

  <!-- AWT Component -->
  <g transform="translate(80, 90)">
    <rect class="box" width="200" height="50" rx="6" fill="url(#awtGrad)" stroke="#ef4444" />
    <text x="100" y="25" class="label">AWT Component (Button)</text>
    <text x="100" y="40" class="subtext">java.awt 패키지</text>
  </g>

  <!-- Peer Interface -->
  <g transform="translate(80, 180)">
    <rect class="box" width="200" height="50" rx="6" fill="#fff" stroke="#fca5a5" />
    <text x="100" y="25" class="label">ButtonPeer (Interface)</text>
    <text x="100" y="40" class="subtext">OS별 컴포넌트 브리지</text>
  </g>

  <!-- Native OS Component -->
  <g transform="translate(80, 270)">
    <rect class="box" width="200" height="50" rx="6" fill="url(#osGrad)" stroke="#9ca3af" />
    <text x="100" y="25" class="label">Native Windows Button</text>
    <text x="100" y="40" class="subtext">Windows OS 리소스 활용</text>
  </g>

  <!-- AWT Connectors -->
  <path class="connector" d="M 180 140 L 180 180" marker-end="url(#arrow)" />
  <path class="connector" d="M 180 230 L 180 270" marker-end="url(#arrow)" />


  <!-- Right Side: Swing Architecture -->
  <text x="540" y="30" class="title">Swing Architecture (Lightweight)</text>
  <rect x="380" y="50" width="320" height="300" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="395" y="70" class="group-label" fill="#2563eb">Pure Java (100%)</text>

  <!-- Swing Component -->
  <g transform="translate(440, 90)">
    <rect class="box" width="200" height="55" rx="6" fill="url(#swingGrad)" stroke="#2563eb" />
    <text x="100" y="23" class="label">Swing Component (JButton)</text>
    <text x="100" y="38" class="subtext">javax.swing 패키지</text>
    <text x="100" y="49" class="subtext">(JComponent 상속)</text>
  </g>

  <!-- Java 2D Engine -->
  <g transform="translate(440, 180)">
    <rect class="box" width="200" height="50" rx="6" fill="#fff" stroke="#93c5fd" />
    <text x="100" y="25" class="label">Java 2D Graphics Engine</text>
    <text x="100" y="40" class="subtext">JVM 내부 픽셀 렌더러</text>
  </g>

  <!-- Frameless Component Draw -->
  <g transform="translate(440, 270)">
    <rect class="box" width="200" height="50" rx="6" fill="#fef08a" stroke="#eab308" />
    <text x="100" y="25" class="label">Painted Directly on Screen</text>
    <text x="100" y="40" class="subtext">모든 OS에서 동일한 디자인</text>
  </g>

  <!-- Swing Connectors -->
  <path class="connector" d="M 540 145 L 540 180" marker-end="url(#arrow)" />
  <path class="connector" d="M 540 230 L 540 270" marker-end="url(#arrow)" />

</svg>
